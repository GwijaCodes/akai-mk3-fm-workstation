<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AKAI MPK Mini Mk3 - Visual FM Workstation</title>
   <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="chassis">
  <header>
    <div class="brand">AKAI <span>MPK MINI MK3</span> // FM-4</div>
    <div id="midiStatus" class="midi-pill">STANDBY</div>
  </header>

  <div class="desk-col">
  <div class="transport">
    <button id="playBtn" aria-label="Play / Stop" title="Play / Stop"><i class="led"></i><svg class="ic ic-play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg><svg class="ic ic-stop" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button>
    <button id="recBtn" aria-label="Step Overdub" title="Step Overdub"><i class="led"></i><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5.2v5.6M5.2 8h5.6" stroke="#151618" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button id="clearBtn" aria-label="Clear / Hold Erase" title="Tap: Clear Track · Hold in Play: Live Erase"><i class="led"></i><svg class="ic" viewBox="0 0 16 16"><path d="M6 1.5h4l.5 1H14V4H2V2.5h3.5z M3.5 5h9l-.7 9H4.2z"/></svg></button>
    <div class="bpm-wrap">
      <div class="bpm-top">
        <div class="bpm-grp">
          <i class="led led-beat" id="beatLed"></i>
          <div class="seg-display" id="bpmDisplay"></div>
          <span class="bpm-unit">BPM</span>
        </div>
        <span class="bpm-unit" id="grooveReadout">SW 0% · P 100%</span>
      </div>
      <input type="range" id="bpmSlider" min="60" max="180" value="115" aria-label="BPM" />
      <div class="groove-row">
        <div class="mini-ctl" title="Swing">
          <svg viewBox="0 0 16 16"><path d="M2 12c3 0 4-8 6-8s3 8 6 8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <input type="range" id="swingSlider" min="0" max="75" value="0" aria-label="Swing" />
        </div>
        <div class="mini-ctl" title="Probability">
          <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="5.5" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="10.5" cy="10.5" r="1.1"/></svg>
          <input type="range" id="probSlider" min="10" max="100" value="100" aria-label="Probability" />
        </div>
      </div>
    </div>
  </div>

  <div class="tracks">
    <div class="trk active" data-i="0">
      <div class="trk-sub" id="pName0">Sub FM</div>
      <div class="trk-btns"><button class="mute-btn" data-m="0">ON</button><button class="solo-btn" data-s="0">SOLO</button></div>
    </div>
    <div class="trk" data-i="1">
      <div class="trk-sub" id="pName1">DX Tines</div>
      <div class="trk-btns"><button class="mute-btn" data-m="1">ON</button><button class="solo-btn" data-s="1">SOLO</button></div>
    </div>
    <div class="trk" data-i="2">
      <div class="trk-sub" id="pName2">80s Poly</div>
      <div class="trk-btns"><button class="mute-btn" data-m="2">ON</button><button class="solo-btn" data-s="2">SOLO</button></div>
    </div>
    <div class="trk" data-i="3">
      <div class="trk-sub" id="pName3">FM Kit</div>
      <div class="trk-btns"><button class="mute-btn" data-m="3">ON</button><button class="solo-btn" data-s="3">SOLO</button></div>
    </div>
  </div>

  <div class="seq-shell">
    <div class="pat-bar" id="patBar">
      <button class="pat-btn on" data-pat="0">A</button>
      <button class="pat-btn" data-pat="1">B</button>
      <button class="pat-btn" data-pat="2">C</button>
      <button class="pat-btn" data-pat="3">D</button>
      <button class="pat-copy" id="copyPatBtn" title="Clone Pattern" aria-label="Clone Pattern">
        <svg class="ic-sm" viewBox="0 0 16 16"><path d="M5 2h8v9h-2V4H5V2zm-2 3h7v9H3V5z"/></svg>
      </button>
    </div>
    <div class="steps" id="stepGrid"></div>
  </div>

  <div class="bottom-bar">
    <button id="presetBtn" title="Next Patch">PATCH</button>
    <button id="exportJsonBtn" title="Export Project JSON" aria-label="Export JSON">
      <svg class="ic-sm" viewBox="0 0 16 16"><path d="M8 1v9l3.5-3.5 1.4 1.4L8 12.8 3.1 7.9l1.4-1.4L8 10V1h0zM2 13h12v2H2v-2z"/></svg>
      <span>JSON</span>
    </button>
    <button id="importJsonBtn" title="Import Project JSON" aria-label="Import JSON">
      <svg class="ic-sm" viewBox="0 0 16 16"><path d="M8 12V3L4.5 6.5 3.1 5.1 8 .2l4.9 4.9-1.4 1.4L8 3v9H8zM2 13h12v2H2v-2z"/></svg>
      <span>JSON</span>
    </button>
    <button id="wavBtn" title="Capture Master Audio" aria-label="Capture Master Audio">
      <svg class="ic-sm" viewBox="0 0 16 16"><path d="M1.5 8h2l1.5-4.5 2 9 2-7 1.5 5 1.5-2.5h2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>AUDIO</span>
    </button>
    <input type="file" id="jsonFileInput" accept=".json,application/json" hidden />
  </div>
  </div>

  <div class="desk-col">
  <div class="pages" id="pageBar"></div>

  <div class="pitch-viz" id="pitchViz">
    <svg viewBox="0 0 220 32" preserveAspectRatio="none">
      <line x1="0" y1="29" x2="220" y2="29" stroke="#241c10" stroke-width="1" />
      <path id="pitchRefPath" fill="none" stroke="#2fc4f2" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85" />
      <path id="pitchStepPath" fill="rgba(255, 176, 46, 0.16)" stroke="#ffb02e" stroke-width="1.8" stroke-linejoin="round" />
      <line id="pitchCursor" x1="-10" y1="2" x2="-10" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0" />
    </svg>
    <div class="pitch-legend" id="pitchLegend">
      <span>1-NOTE</span>
      <span>MIN7 · 1-SHOT</span>
    </div>
  </div>

  <div class="knobs-grid" id="knobsGrid"></div>

  <div class="hw-top">
    <div class="joy-box">
      <div class="joy-ring">
        <div class="joy-stick" id="joyDot"></div>
      </div>
      <button class="sus-btn" id="susBtn" title="Sustain Hold (CC64)">SUS</button>
    </div>
    <div class="pads-grid" id="padsGrid"></div>
  </div>

  <div class="keys-wrap" id="keysWrap"></div>

  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
